<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">UI route and component architecture for traceability workflows</title>
  <desc id="desc">Diagram showing the three main UI routes, the shared UI orchestration layer, and the backend endpoints used by each route.</desc>

  <defs>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #16324f; }
      .subtitle { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .section { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #102a43; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #102a43; }
      .text { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #243b53; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .route { fill: #e6f4ea; stroke: #2f855a; stroke-width: 2.5; rx: 18; ry: 18; }
      .shared { fill: #eef2ff; stroke: #4c51bf; stroke-width: 2.5; rx: 18; ry: 18; }
      .backend { fill: #fff4e6; stroke: #c05621; stroke-width: 2.5; rx: 18; ry: 18; }
      .group { fill: #f8fafc; stroke: #cbd5e0; stroke-width: 2; rx: 24; ry: 24; }
      .arrow { stroke: #334e68; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334e68" />
    </marker>
  </defs>

  <rect x="24" y="24" width="1352" height="812" rx="26" ry="26" fill="#ffffff" stroke="#d9e2ec" stroke-width="2" />

  <text x="70" y="78" class="title">MES-X UI Route and Component Architecture</text>
  <text x="70" y="112" class="subtitle">Route-level screens orchestrate traceability workflows through shared UI services and dedicated backend endpoints.</text>

  <rect x="60" y="150" width="1280" height="255" class="group" />
  <text x="86" y="186" class="section">UI Routes</text>

  <rect x="92" y="220" width="360" height="145" class="route" />
  <text x="116" y="255" class="label">RelatedWorkItemTrace</text>
  <text x="116" y="287" class="text">Single-root analysis screen</text>
  <text x="116" y="315" class="small">- enter one work item id</text>
  <text x="116" y="340" class="small">- launch dependency trace</text>
  <text x="116" y="365" class="small">- inspect returned related artifacts</text>

  <rect x="520" y="220" width="360" height="145" class="route" />
  <text x="544" y="255" class="label">BatchWorkItemTrace</text>
  <text x="544" y="287" class="text">Task loading and selection screen</text>
  <text x="544" y="315" class="small">- progressive SSE task loading</text>
  <text x="544" y="340" class="small">- select multiple roots</text>
  <text x="544" y="365" class="small">- prepare batch analysis</text>

  <rect x="948" y="220" width="360" height="145" class="route" />
  <text x="972" y="255" class="label">BatchRelatedWorkItemTrace</text>
  <text x="972" y="287" class="text">Aggregated result screen</text>
  <text x="972" y="315" class="small">- display multi-root trace result</text>
  <text x="972" y="340" class="small">- group data by repository</text>
  <text x="972" y="365" class="small">- show commit and tag enrichment</text>

  <rect x="60" y="435" width="1280" height="180" class="group" />
  <text x="86" y="471" class="section">Shared UI Orchestration Layer</text>

  <rect x="108" y="505" width="300" height="78" class="shared" />
  <text x="132" y="540" class="label">Router and View Composition</text>
  <text x="132" y="566" class="small">navigation, route params, page structure</text>

  <rect x="452" y="505" width="300" height="78" class="shared" />
  <text x="476" y="540" class="label">Trace State and Models</text>
  <text x="476" y="566" class="small">selected roots, result state, typed frontend models</text>

  <rect x="796" y="505" width="238" height="78" class="shared" />
  <text x="820" y="540" class="label">Trace API Layer</text>
  <text x="820" y="566" class="small">Axios-based backend integration</text>

  <rect x="1078" y="505" width="214" height="78" class="shared" />
  <text x="1102" y="540" class="label">SSE Client</text>
  <text x="1102" y="566" class="small">stream consumption for task loading</text>

  <rect x="60" y="645" width="1280" height="145" class="group" />
  <text x="86" y="681" class="section">Backend Endpoints Consumed by the UI</text>

  <rect x="110" y="713" width="280" height="50" class="backend" />
  <text x="132" y="744" class="text">GET /workitem/:id/related</text>

  <rect x="435" y="713" width="280" height="50" class="backend" />
  <text x="457" y="744" class="text">GET /workitem/tasks/stream</text>

  <rect x="760" y="713" width="250" height="50" class="backend" />
  <text x="782" y="744" class="text">GET /workitem/related</text>

  <rect x="1055" y="713" width="235" height="50" class="backend" />
  <text x="1077" y="744" class="text">POST /commits/tags/batch</text>

  <line x1="272" y1="365" x2="258" y2="505" class="arrow" />
  <line x1="700" y1="365" x2="602" y2="505" class="arrow" />
  <line x1="1128" y1="365" x2="258" y2="505" class="arrow dashed" />
  <line x1="1128" y1="365" x2="602" y2="505" class="arrow" />
  <line x1="1128" y1="365" x2="915" y2="505" class="arrow" />

  <line x1="258" y1="583" x2="258" y2="713" class="arrow" />
  <line x1="915" y1="583" x2="250" y2="713" class="arrow dashed" />
  <line x1="1185" y1="583" x2="575" y2="713" class="arrow" />
  <line x1="915" y1="583" x2="885" y2="713" class="arrow" />
  <line x1="915" y1="583" x2="1172" y2="713" class="arrow" />

  <text x="104" y="812" class="subtitle">Suggested usage in report: replace the placeholder figure with this SVG or export it to PNG if your LaTeX toolchain does not embed SVG directly.</text>
</svg>
